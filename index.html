<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4Z vs Zombie Alarmo</title><style>body{margin:0;padding:0;font-family:Arial,sans-serif;background-color:#32CD32;background-image:url('820.png');background-size:cover;background-position:center;background-attachment:fixed;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}h1{color:#000;font-size:28px;margin-top:20px;font-weight:bold;text-shadow:1px 1px 2px #fff;position:relative;z-index:10}#clock-frame{background-color:#000;border:4px solid #fff;padding:15px 30px;border-radius:10px;margin-top:10px;text-align:center;transition:all .2s;position:relative;z-index:10}#clock{color:#32CD32;font-family:'Courier New',Courier,monospace;font-size:40px;font-weight:bold}#mode{color:#fff;background-color:#000;padding:5px 10px;margin-top:10px;font-size:16px;font-weight:bold;border-radius:5px;position:relative;z-index:10}#stop-btn{background-color:red;color:#fff;font-size:16px;font-weight:bold;border:none;padding:12px 24px;margin-top:15px;border-radius:5px;cursor:pointer;box-shadow:0 4px #900;position:relative;z-index:10}#stop-btn:active{box-shadow:0 2px #900;transform:translateY(2px)}.tabs{display:flex;margin-top:20px;background:rgba(255,255,255,.6);padding:5px;border-radius:5px;position:relative;z-index:10}.tab-btn{background:none;border:none;padding:10px 15px;font-size:14px;cursor:pointer;color:#000;font-weight:bold}.tab-btn.active{background-color:#fff;border-radius:3px}.tab-content{background-color:rgba(240,240,240,.95);padding:20px;border-radius:10px;width:85%;max-width:360px;margin-top:10px;box-shadow:0 4px 6px rgba(0,0,0,.2);display:none;box-sizing:border-box;position:relative;z-index:10}.tab-content.active{display:block}.days-container{display:flex;justify-content:space-between;margin-top:15px;margin-bottom:15px}.day-checkbox{display:none}.day-label{padding:6px 8px;background-color:#fff;border:2px solid #ccc;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold;user-select:none}.day-checkbox:checked+.day-label{background-color:#32CD32;border-color:#000;color:#fff}input[type=number]{padding:5px;font-size:16px;border-radius:5px;border:1px solid #ccc;text-align:center}.action-btn{background-color:#000;color:#fff;border:none;padding:10px 20px;font-size:14px;font-weight:bold;border-radius:5px;cursor:pointer;width:100%}</style></head><body><h1>4Z vs Zombie</h1><div id="clock-frame"><div id="clock">00:00:00</div></div><div id="mode">Режим: Дима</div><button id="stop-btn" onclick="stopAlarm()">🚨 ВЫКЛ БУДИЛЬНИК 🚨</button><div class="tabs"><button id="btn-alarm" class="tab-btn active" onclick="switchTab('alarm')">Будильник</button><button id="btn-almanac" class="tab-btn" onclick="switchTab('almanac')">Альманах</button><button id="btn-hero" class="tab-btn" onclick="switchTab('hero')">Герой</button></div><div id="alarm" class="tab-content active"><h3 style="margin-top:0">Установка времени</h3><label>Часы: <input type="number" id="alarm-hour" value="07" min="0" max="23" style="width:50px"></label><label style="margin-left:10px">Мин: <input type="number" id="alarm-min" value="00" min="0" max="59" style="width:50px"></label><h4>Повтор по дням:</h4><div class="days-container"><input type="checkbox" id="day-1" class="day-checkbox" value="1"><label for="day-1" class="day-label">Пн</label><input type="checkbox" id="day-2" class="day-checkbox" value="2"><label for="day-2" class="day-label">Вт</label><input type="checkbox" id="day-3" class="day-checkbox" value="3"><label for="day-3" class="day-label">Ср</label><input type="checkbox" id="day-4" class="day-checkbox" value="4"><label for="day-4" class="day-label">Чт</label><input type="checkbox" id="day-5" class="day-checkbox" value="5"><label for="day-5" class="day-label">Пт</label><input type="checkbox" id="day-6" class="day-checkbox" value="6"><label for="day-6" class="day-label">Сб</label><input type="checkbox" id="day-0" class="day-checkbox" value="0"><label for="day-0" class="day-label">Вс</label></div><button class="action-btn" onclick="setAlarm()">Поставить будильник</button></div><div id="almanac" class="tab-content"><h3 style="margin-top:0">Альманах Героев</h3><p id="almanac-text"><b>ГЕРОЙ: Дима</b><br><br>Тяжелая артиллерия. Запускает по навесной траектории бутылки, которые наносят огромный урон по площади.</p><button class="action-btn" onclick="speakAlmanac()">🔊 Озвучить описание</button></div><div id="hero" class="tab-content"><h3 style="margin-top:0">Выбор активного героя</h3><button class="action-btn" onclick="nextCharacter()">Следующий герой</button></div><script>const characters=["Дима","Петя Сухоруков","Тихон","Властелина","Артём"];const descriptions={Тихон:"Мастер двойного удара. Вместо обычного гороха выпускает во врагов стремительные кулаки. Пришел «с улиц» и не терпит наглого отношения.","Петя Сухоруков":"Главный защитник и «живой щит». Его непробиваемая преграда выигрывает время для всей команды.",Дима:"Тяжелая артиллерия. Запускает по навесной траектории бутылки, которые наносят огромный урон по площади.",Властелина:"Основа экономики отряда. Постоянно производит энергию и сохраняет жизнерадостный настрой.",Артём:"Надежный передовой боец. Ведет прицельный огонь кулаками, выбивая всю дурь из наступающих зомби."};let currentIdx=0,alarmTime=null,alarmActive=!1,selectedDays=[],alarmInterval=null;function updateClock(){const e=new Date,t=String(e.getHours()).padStart(2,"0"),n=String(e.getMinutes()).padStart(2,"0"),a=String(e.getSeconds()).padStart(2,"0"),c=`${t}:${n}:${a}`;if(document.getElementById("clock").innerText=c,alarmTime&&c===alarmTime+":00"&&!alarmActive){const o=e.getDay();(0===selectedDays.length||selectedDays.includes(o))&&(alarmActive=!0,triggerAlarm())}}function nextCharacter(){if(alarmActive)return;currentIdx=(currentIdx+1)%characters.length;const e=characters[currentIdx];document.getElementById("mode").innerText="Режим: "+e,document.getElementById("almanac-text").innerHTML=`<b>ГЕРОЙ: ${e}</b><br><br>${descriptions[e]}`,speak(e)}function setAlarm(){const e=document.getElementById("alarm-hour").value.padStart(2,"0"),t=document.getElementById("alarm-min").value.padStart(2,"0");alarmTime=`${e}:${t}`,selectedDays=[],document.querySelectorAll(".day-checkbox:checked").forEach(e=>{selectedDays.push(parseInt(e.value))}),speak("Будильник поставлен"),document.getElementById("clock-frame").style.borderColor="blue",setTimeout(()=>{document.getElementById('clock-frame').style.borderColor="white"},500)}function triggerAlarm(){alarmActive&&!alarmInterval&&(alarmInterval=setInterval(()=>{const e=document.getElementById("clock-frame");e.style.backgroundColor="red"===e.style.backgroundColor?"black":"red",speak("Зомби идут! Просыпайся!")},1500))}function stopAlarm(){alarmActive&&(alarmActive=!1,clearInterval(alarmInterval),alarmInterval=null,window.speechSynthesis.cancel(),document.getElementById("clock-frame").style.backgroundColor="black",document.getElementById("clock-frame").style.borderColor="white",setTimeout(()=>{speak("Угроза устранена")},300))}function speakAlmanac(){if(alarmActive)return;const e=characters[currentIdx];speak(`Герой ${e}. ${descriptions[e]}`)}function speak(e){window.speechSynthesis.cancel();const t=new SpeechSynthesisUtterance(e);t.lang="ru-RU",window.speechSynthesis.speak(t)}function switchTab(e){document.querySelectorAll(".tab-content").forEach(e=>e.classList.remove("active")),document.querySelectorAll(".tab-btn").forEach(e=>e.classList.remove("active")),document.getElementById(e).classList.add("active"),"alarm"===e&&document.getElementById("btn-alarm").classList.add("active"),"almanac"===e&&document.getElementById("btn-almanac").classList.add("active"),"hero"===e&&document.getElementById("btn-hero").classList.add("active")}setInterval(updateClock,1000),updateClock();</script></body></html>
