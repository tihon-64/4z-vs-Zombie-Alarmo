<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4Z vs Zombie Alarmo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #32CD32; /* Лаймовый фон по умолчанию */
            background-image: url('820.png'); /* Твоя картинка фона */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        h1 {
            color: black;
            font-size: 28px;
            margin-top: 20px;
            font-weight: bold;
        }
        #clock-frame {
            background-color: black;
            border: 4px solid white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-top: 10px;
            text-align: center;
            transition: all 0.2s;
        }
        #clock {
            color: #32CD32;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            font-weight: bold;
        }
        #mode {
            color: white;
            background-color: black;
            padding: 5px 10px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
        }
        #stop-btn {
            background-color: red;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Стили для вкладок */
        .tabs {
            display: flex;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px;
            border-radius: 5px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            color: black;
        }
        .tab-btn.active {
            background-color: white;
            border-radius: 3px;
            font-weight: bold;
        }
        .tab-content {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 350px;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <h1>4Z vs Zombie</h1>

    <div id="clock-frame">
        <div id="clock">00:00:00</div>
    </div>

    <div id="mode">Режим: Дима</div>

    <button id="stop-btn" onclick="stopAlarm()">🚨 ВЫКЛ БУДИЛЬНИК 🚨</button>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('alarm')">Будильник</button>
        <button class="tab-btn" onclick="switchTab('almanac')">Альманах</button>
        <button class="tab-btn" onclick="switchTab('hero')">Герой</button>
    </div>

    <!-- Контент вкладок -->
    <div id="alarm" class="tab-content active">
        <h3>Установка времени</h3>
        Часы: <input type="number" id="alarm-hour" value="07" style="width: 40px;">
        Мин: <input type="number" id="alarm-min" value="00" style="width: 40px;">
        <br><br>
        <button onclick="setAlarm()">Поставить будильник</button>
    </div>

    <div id="almanac" class="tab-content">
        <h3>Альманах Героев</h3>
        <p id="almanac-text">ГЕРОЙ: Дима<br><br>Тяжелая артиллерия. Запускает по навесной траектории бутылки...</p>
        <button onclick="speakAlmanac()">🔊 Озвучить описание</button>
    </div>

    <div id="hero" class="tab-content">
        <h3>Выбор активного героя</h3>
        <button onclick="nextCharacter()" style="background: black; color: white; padding: 10px; font-size: 16px;">Следующий герой</button>
    </div>

    <script>
        const characters = ["Дима", "Петя Сухоруков", "Тихон", "Властелина", "Артём"];
        const descriptions = {
            "Тихон": "Мастер двойного удара. Вместо обычного гороха выпускает во врагов стремительные кулаки. Пришел «с улиц» и не терпит наглого отношения.",
            "Петя Сухоруков": "Главный защитник и «живой щит». Его непробиваемая преграда выигрывает время для всей команды.",
            "Дима": "Тяжелая артиллерия. Запускает по навесной траектории бутылки, которые наносят огромный урон по площади.",
            "Властелина": "Основа экономики отряда. Постоянно производит энергию и сохраняет жизнерадостный настрой.",
            "Артём": "Надежный передовой боец. Ведет прицельный огонь кулаками, выбивая всю дурь из наступающих зомби."
        };
        let currentIdx = 0;
        let alarmTime = null;
        let alarmActive = false;
        let alarmInterval;

        // Обновление часов
        setInterval(() => {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            document.getElementById('clock').innerText = timeString;

            // Проверка будильника
            if (alarmTime && timeString.startsWith(alarmTime) && !alarmActive) {
                alarmActive = true;
                triggerAlarm();
            }
        }, 1000);

        function nextCharacter() {
            if (alarmActive) return;
            currentIdx = (current_idx = currentIdx + 1) % characters.length;
            const name = characters[currentIdx];
            document.getElementById('mode').innerText = "Режим: " + name;
            document.getElementById('almanac-text').innerHTML = `<b>ГЕРОЙ: ${name}</b><br><br>${descriptions[name]}`;
            speak(name);
        }

        function setAlarm() {
            const h = document.getElementById('alarm-hour').value.padStart(2, '0');
            const m = document.getElementById('alarm-min').value.padStart(2, '0');
            alarmTime = `${h}:${m}`;
            speak("Будильник поставлен");
            document.getElementById('clock-frame').style.borderColor = "blue";
            setTimeout(() => document.getElementById('clock-frame').style.borderColor = "white", 500);
        }

        function triggerAlarm() {
            alarmInterval = setInterval(() => {
                const frame = document.getElementById('clock-frame');
                frame.style.backgroundColor = frame.style.backgroundColor === 'red' ? 'black' : 'red';
                speak("Зомби идут! Просыпайся!");
            }, 1000);
        }

        function stopAlarm() {
            if (alarmActive) {
                alarmActive = false;
                clearInterval(alarmInterval);
                const frame = document.getElementById('clock-frame');
                frame.style.backgroundColor = 'black';
                frame.style.borderColor = 'white';
                speak("Угроза устранена");
            }
        }

        function speakAlmanac() {
            const name = characters[currentIdx];
            speak(`Герой ${name}. ${descriptions[name]}`);
        }

        // Встроенная озвучка Web Speech API (работает в любом браузере смартфона!)
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            window.speechSynthesis.speak(utterance);
        }

        // Переключение вкладок
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
        speak("Зомби идут! Просыпайся!");
        setTimeout(triggerAlarm, 1500);
        }
        function stopAlarm() {
            if (alarmActive) {
                alarmActive = false;window.speechSynthesis.cancel();const frame = document.getElementById('clock-frame');frame.style.backgroundColor = 'black';frame.style.borderColor = 'white';setTimeout(() => {speak("Угроза устранена");}, 300);}}function speakAlmanac() {if (alarmActive) return;const name = characters[currentIdx];speak(Герой ${name}. ${descriptions[name]});}function speak(text) {window.speechSynthesis.cancel();const utterance = new SpeechSynthesisUtterance(text);utterance.lang = 'ru-RU';window.speechSynthesis.speak(utterance);}function switchTab(tabId) {document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));document.getElementById(tabId).classList.add('active');event.target.classList.add('active');}
    </script>
</body>
</html>
