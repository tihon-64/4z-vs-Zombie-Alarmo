<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4Z vs Zombie Alarmo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #32CD32;
            background-image: url('820.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: black;
            font-size: 28px;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px white;
            position: relative;
            z-index: 10;
        }
        #clock-frame {
            background-color: black;
            border: 4px solid white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-top: 10px;
            text-align: center;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }
        #clock {
            color: #32CD32;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            font-weight: bold;
        }
        #mode {
            color: white;
            background-color: black;
            padding: 5px 10px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            position: relative;
            z-index: 10;
        }
        #stop-btn {
            background-color: red;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #990000;
            position: relative;
            z-index: 10;
        }
        #stop-btn:active {
            box-shadow: 0 2px #990000;
            transform: translateY(2px);
        }
        .tabs {
            display: flex;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px;
            border-radius: 5px;
            position: relative;
            z-index: 10;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            color: black;
            font-weight: bold;
        }
        .tab-btn.active {
            background-color: white;
            border-radius: 3px;
            font-weight: bold;
        }
        .tab-content {
            background-color: rgba(240, 240, 240, 0.95);
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 360px;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }
        .tab-content.active { display: block; }
        
        .days-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .day-checkbox {
            display: none;
        }
        .day-label {
            padding: 6px 8px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            user-select: none;
        }
        .day-checkbox:checked + .day-label {
            background-color: #32CD32;
            border-color: black;
            color: white;
        }
        input[type="number"] {
            padding: 5px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .action-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>4Z vs Zombie</h1>

    <div id="clock-frame">
        <div id="clock">00:00:00</div>
    </div>

    <div id="mode">Режим: Дима</div>

    <button id="stop-btn" onclick="stopAlarm()">🚨 ВЫКЛ БУДИЛЬНИК 🚨</button>

    <div class="tabs">
        <button id="btn-alarm" class="tab-btn active" onclick="switchTab('alarm')">Будильник</button>
        <button id="btn-almanac" class="tab-btn" onclick="switchTab('almanac')">Альманах</button>
        <button id="btn-hero" class="tab-btn" onclick="switchTab('hero')">Герой</button>
    </div>

    <div id="alarm" class="tab-content active">
        <h3 style="margin-top:0;">Установка времени</h3>
        <label>Часы: <input type="number" id="alarm-hour" value="07" min="0" max="23" style="width: 50px;"></label>
        <label style="margin-left:10px;">Мин: <input type="number" id="alarm-min" value="00" min="0" max="59" style="width: 50px;"></label>
        
        <h4>Повтор по дням:</h4>
        <div class="days-container">
            <input type="checkbox" id="day-1" class="day-checkbox" value="1"><label for="day-1" class="day-label">Пн</label>
            <input type="checkbox" id="day-2" class="day-checkbox" value="2"><label for="day-2" class="day-label">Вт</label>
            <input type="checkbox" id="day-3" class="day-checkbox" value="3"><label for="day-3" class="day-label">Ср</label>
            <input type="checkbox" id="day-4" class="day-checkbox" value="4"><label for="day-4" class="day-label">Чт</label>
            <input type="checkbox" id="day-5" class="day-checkbox" value="5"><label for="day-5" class="day-label">Пт</label>
            <input type="checkbox" id="day-6" class="day-checkbox" value="6"><label for="day-6" class="day-label">Сб</label>
            <input type="checkbox" id="day-0" class="day-checkbox" value="0"><label for="day-0" class="day-label">Вс</label>
        </div>
        
        <button class="action-btn" onclick="setAlarm()">Поставить будильник</button>
    </div>

    <div id="almanac" class="tab-content">
        <h3 style="margin-top:0;">Альманах Героев</h3>
        <p id="almanac-text"><b>ГЕРОЙ: Дима</b><br><br>Тяжелая артиллерия. Запускает по навесной траектории бутылки, которые наносят огромный урон по площади.</p>
        <button class="action-btn" onclick="speakAlmanac()">🔊 Озвучить описание</button>
    </div>

    <div id="hero" class="tab-content">
        <h3 style="margin-top:0;">Выбор активного героя</h3>
        <button class="action-btn" onclick="nextCharacter()">Следующий герой</button>
    </div>

    <script>
        const characters = ["Дима", "Петя Сухоруков", "Тихон", "Властелина", "Артём"];
        const descriptions = {
            "Тихон": "Мастер двойного удара. Вместо обычного гороха выпускает во врагов стремительные кулаки. Пришел «с улиц» и не терпит наглого отношения.",
            "Петя Сухоруков": "Главный защитник и «живой щит». Его непробиваемая преграда выигрывает время для всей команды.",
            "Дима": "Тяжелая артиллерия. Запускает по навесной траектории бутылки, которые наносят огромный урон по площади.",
            "Властелина": "Основа экономики отряда. Постоянно производит энергию и сохраняет жизнерадостный настрой.",
            "Артём": "Надежный передовой боец. Ведет прицельный огонь кулаками, выбивая всю дурь из наступающих зомби."
        };
        let currentIdx = 0;
        let alarmTime = null;
        let alarmActive = false;
        let selectedDays = [];
        let alarmInterval = null;

        // Корректный вывод времени
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const currentTimeString = `${h}:${m}:${s}`;
            
            document.getElementById('clock').innerText = currentTimeString;

            if (alarmTime && currentTimeString === (alarmTime + ":00") && !alarmActive) {
                const currentDay = now.getDay();
                if (selectedDays.length === 0 || selectedDays.includes(currentDay)) {
                    alarmActive = true;
                    triggerAlarm();
                }
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function nextCharacter() {
            if (alarmActive) return;
            currentIdx = (currentIdx + 1) % characters.length;
            const name = characters[currentIdx];
            document.getElementById('mode').innerText = "Режим: " + name;
            document.getElementById('almanac-text').innerHTML = `<b>ГЕРОЙ: ${name}</b><br><br>${descriptions[name]}`;
            speak(name);
        }

        function setAlarm() {
            const h = document.getElementById('alarm-hour').value.padStart(2, '0');
            const m = document.getElementById('alarm-min').value.padStart(2, '0');
            alarmTime = `${h}:${m}`;
            
            selectedDays = [];
            document.querySelectorAll('.day-checkbox:checked').forEach(chk => {
                selectedDays.push(parseInt(chk.value));
            });

            speak("Будильник поставлен");
            document.getElementById('clock-frame').style.borderColor = "blue";
            setTimeout(() => document.getElementById('clock-frame').style.borderColor = "white", 500);
        }

        function triggerAlarm() {
            if (!alarmActive) return;
        if(!alarmInterval) {
  alarmInterval = setInterval(() => {
    const frame = document.getElementById('clock-frame');
    frame.style.backgroundColor = frame.style.backgroundColor === 'red' ? 'black' : 'red';
    speak("Зомби идут! Просыпайся!");
  }, 1500);
}

function stopAlarm() {
  if (alarmActive) {
    alarmActive = false;
    clearInterval(alarmInterval);
    alarmInterval = null;
    window.speechSynthesis.cancel();

    const frame = document.getElementById('clock-frame');
    frame.style.backgroundColor = 'black';
    frame.style.borderColor = 'white';

    setTimeout(() => {
      speak("Угроза устранена");
    }, 300);
  }
}

function speakAlmanac() {
  if (alarmActive) return;
  const name = characters[currentIdx];
  speak(`Герой ${name}. ${descriptions[name]}`);
}

function speak(text) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ru-RU';
  window.speechSynthesis.speak(utterance);
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');

  if(tabId === 'alarm') document.getElementById('btn-alarm').classList.add('active');
  if(tabId === 'almanac') document.getElementById('btn-almanac').classList.add('active');
  if(tabId === 'hero') document.getElementById('btn-hero').classList.add('active');
}
</body>
</html>
